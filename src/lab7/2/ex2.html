<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflowable Form</title>
    <link rel="stylesheet" href="ex2.css">
</head>
<body>

    <h1>Reflowable Flex Form</h1>

    <form class="form-container">

        <div class="form-item">
            <label>First Name</label>
            <input type="text" />
        </div>

        <div class="form-item">
            <label>Last Name</label>
            <input type="text" />
        </div>

        <div class="form-item">
            <label>Email</label>
            <input type="email" />
        </div>

        <div class="form-item">
            <label>Phone</label>
            <input type="text" />
        </div>

        <div class="form-item">
            <label>City</label>
            <input type="text" />
        </div>

        <div class="form-item">
            <label>Address</label>
            <input type="text" />
        </div>

        <button type="submit" class="submit-btn">Submit</button>

    </form>

</body>
</html>
