<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UI</title>
    <link rel="stylesheet" href="ex6.css">
</head>

<body>
    <div class="container">

        <!-- SEARCH BAR -->
        <div class="search-bar">
            <input type="text" placeholder="Search or start chat">
        </div>

        <!-- CONTACTS LIST -->
        <div class="contacts">

            <div class="contact">
                <div class="avatar">J</div>
                <div class="contact-info">
                    <div class="name">Jim</div>
                    <div class="status">Here</div>
                </div>
            </div>

            <div class="contact">
                <div class="avatar">J</div>
                <div class="contact-info">
                    <div class="name">Jane</div>
                    <div class="status">Here</div>
                </div>
            </div>

            <div class="contact">
                <div class="avatar">J</div>
                <div class="contact-info">
                    <div class="name">John</div>
                    <div class="status">Here</div>
                </div>
            </div>

            <div class="contact">
                <div class="avatar">B</div>
                <div class="contact-info">
                    <div class="name">Batman</div>
                    <div class="status">Here</div>
                </div>
            </div>

        </div>

        <!-- CHAT HEADER -->
        <div class="chat-heading">
            <div class="avatar big">J</div>
            <div class="interlocutor">Jim</div>
        </div>

        <!-- CHAT MESSAGES -->
        <div class="chat">

            <div class="message me">
                <div class="bubble">Message from me</div>
                <div class="time">10-10-10</div>
            </div>

            <div class="message them">
                <div class="bubble">Message from Jim</div>
                <div class="time">10-10-10</div>
            </div>

            <div class="message me">
                <div class="bubble">Message from me</div>
                <div class="time">10-10-10</div>
            </div>

        </div>

       
        <div class="chat-input">
            <input type="text" placeholder="input message here">
            <button>&gt;</button>
        </div>

    </div>
</body>

</html>
