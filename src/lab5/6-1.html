<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Client API - Cereri GET și POST</title>
  </head>
  <body>
    <h2>Adaugă o persoană</h2>
    <form>
      <input id="inputName" type="text" placeholder="Nume" />
      <input id="inputAge" type="number" placeholder="Vârstă" />
      <input value="Trimite" onclick="sendData()" type="button" />
    </form>

    <h2>Caută persoană după ID</h2>
    <form>
      <input id="inputId" type="number" placeholder="ID" />
      <input value="Caută" onclick="getById()" type="button" />
    </form>

    <div id="tableData"></div>
    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="6.js"></script>
  </body>
</html>
